<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 892" width="1180" height="892" font-family="'PT Sans','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1180" height="892" fill="#FFFFFF"/><text x="24" y="34" font-size="17" font-weight="700" fill="#1F3A5F">Hangi analizi seçmeliyim?</text><text x="24" y="54" font-size="11.5" fill="#6B7280">Soru türünden teste, testten etki büyüklüğüne</text><text x="300" y="804" font-size="11" font-weight="700" fill="#6B7280">DURUM</text><text x="700" y="804" font-size="11" font-weight="700" fill="#6B7280">TEST</text><text x="1044" y="804" font-size="11" font-weight="700" fill="#6B7280">ETKİ BÜYÜKLÜĞÜ</text><rect x="24" y="76" width="240" height="82" rx="9" fill="#227C8C"/><text x="40" y="102.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" font-weight="700">BETİMLEME</text><text x="40" y="122" font-size="11.8" fill="#FFFFFF" text-anchor="start">“Veri neye benziyor?”</text><path d="M264 117.0 C292 117.0, 272 100, 300 100" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="98.0" font-size="11.6" fill="#2B3038" text-anchor="start">Sürekli değişken</text><path d="M606 100 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#227C8C" stroke-width="1.5"/><rect x="700" y="80" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#227C8C" stroke-width="1.1"/><text x="711" y="98.0" font-size="11.6" fill="#227C8C" text-anchor="start" font-weight="700">Ortalama · standart sapma</text><text x="711" y="110.5" font-size="11.6" fill="#227C8C" text-anchor="start" font-weight="700">Çarpıklık · basıklık</text><text x="1044" y="104" font-size="10.8" fill="#6B7280" text-anchor="start">—</text><path d="M264 117.0 C292 117.0, 272 146, 300 146" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="144.0" font-size="11.6" fill="#2B3038" text-anchor="start">Sıralı / kategorik</text><path d="M606 146 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#227C8C" stroke-width="1.5"/><rect x="700" y="126" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#227C8C" stroke-width="1.1"/><text x="711" y="144.0" font-size="11.6" fill="#227C8C" text-anchor="start" font-weight="700">Ortanca · çeyrekler</text><text x="711" y="156.5" font-size="11.6" fill="#227C8C" text-anchor="start" font-weight="700">Frekans ve yüzde</text><text x="1044" y="150" font-size="10.8" fill="#6B7280" text-anchor="start">—</text><rect x="24" y="184" width="240" height="174" rx="9" fill="#1F3A5F"/><text x="40" y="210.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" font-weight="700">FARK</text><text x="40" y="230" font-size="11.8" fill="#FFFFFF" text-anchor="start">“Gruplar birbirinden</text><text x="40" y="244" font-size="11.8" fill="#FFFFFF" text-anchor="start">farklı mı?”</text><path d="M264 271.0 C292 271.0, 272 208, 300 208" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="206.0" font-size="11.6" fill="#2B3038" text-anchor="start">2 grup · bağımsız</text><text x="300" y="218.5" font-size="11.6" fill="#2B3038" text-anchor="start">varsayım sağlanıyor</text><path d="M606 208 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#1F3A5F" stroke-width="1.5"/><rect x="700" y="188" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#1F3A5F" stroke-width="1.1"/><text x="711" y="206.0" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">Bağımsız örneklem t testi</text><text x="711" y="218.5" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">(varyans eşit değilse Welch)</text><text x="1044" y="212" font-size="10.8" fill="#6B7280" text-anchor="start">Cohen d</text><path d="M264 271.0 C292 271.0, 272 254, 300 254" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="252.0" font-size="11.6" fill="#2B3038" text-anchor="start">2 grup · bağımsız</text><text x="300" y="264.5" font-size="11.6" fill="#2B3038" text-anchor="start">varsayım sağlanmıyor</text><path d="M606 254 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#1F3A5F" stroke-width="1.5"/><rect x="700" y="234" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#1F3A5F" stroke-width="1.1"/><text x="711" y="252.0" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">Mann–Whitney U</text><text x="1044" y="258" font-size="10.8" fill="#6B7280" text-anchor="start">Sıra-noktasal r</text><path d="M264 271.0 C292 271.0, 272 300, 300 300" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="298.0" font-size="11.6" fill="#2B3038" text-anchor="start">2 ölçüm · aynı kişiler</text><path d="M606 300 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#1F3A5F" stroke-width="1.5"/><rect x="700" y="280" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#1F3A5F" stroke-width="1.1"/><text x="711" y="298.0" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">Eşleştirilmiş t testi</text><text x="711" y="310.5" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">veya Wilcoxon işaretli sıralar</text><text x="1044" y="304" font-size="10.8" fill="#6B7280" text-anchor="start">Cohen d</text><path d="M264 271.0 C292 271.0, 272 346, 300 346" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="344.0" font-size="11.6" fill="#2B3038" text-anchor="start">3 ve daha fazla grup</text><path d="M606 346 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#1F3A5F" stroke-width="1.5"/><rect x="700" y="326" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#1F3A5F" stroke-width="1.1"/><text x="711" y="344.0" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">Tek yönlü ANOVA + Tukey</text><text x="711" y="356.5" font-size="11.6" fill="#1F3A5F" text-anchor="start" font-weight="700">veya Kruskal–Wallis + Dunn</text><text x="1044" y="350" font-size="10.8" fill="#6B7280" text-anchor="start">eta kare / epsilon kare</text><rect x="24" y="384" width="240" height="82" rx="9" fill="#A96F22"/><text x="40" y="410.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" font-weight="700">İLİŞKİ</text><text x="40" y="430" font-size="11.8" fill="#FFFFFF" text-anchor="start">“Birlikte mi</text><text x="40" y="444" font-size="11.8" fill="#FFFFFF" text-anchor="start">değişiyorlar?”</text><path d="M264 425.0 C292 425.0, 272 408, 300 408" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="406.0" font-size="11.6" fill="#2B3038" text-anchor="start">İki sürekli değişken</text><path d="M606 408 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#A96F22" stroke-width="1.5"/><rect x="700" y="388" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#A96F22" stroke-width="1.1"/><text x="711" y="406.0" font-size="11.6" fill="#A96F22" text-anchor="start" font-weight="700">Pearson r (doğrusal)</text><text x="711" y="418.5" font-size="11.6" fill="#A96F22" text-anchor="start" font-weight="700">Spearman rho (monotonik)</text><text x="1044" y="412" font-size="10.8" fill="#6B7280" text-anchor="start">r kare</text><path d="M264 425.0 C292 425.0, 272 454, 300 454" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="452.0" font-size="11.6" fill="#2B3038" text-anchor="start">İki kategorik değişken</text><path d="M606 454 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#A96F22" stroke-width="1.5"/><rect x="700" y="434" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#A96F22" stroke-width="1.1"/><text x="711" y="452.0" font-size="11.6" fill="#A96F22" text-anchor="start" font-weight="700">Ki-kare bağımsızlık testi</text><text x="711" y="464.5" font-size="11.6" fill="#A96F22" text-anchor="start" font-weight="700">(beklenen &lt; 5 ise Fisher)</text><text x="1044" y="458" font-size="10.8" fill="#6B7280" text-anchor="start">Cramér V</text><rect x="24" y="492" width="240" height="128" rx="9" fill="#5E4C7D"/><text x="40" y="518.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" font-weight="700">YORDAMA</text><text x="40" y="538" font-size="11.8" fill="#FFFFFF" text-anchor="start">“Bir değişkeni</text><text x="40" y="552" font-size="11.8" fill="#FFFFFF" text-anchor="start">açıklayabilir miyim?”</text><path d="M264 556.0 C292 556.0, 272 516, 300 516" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="514.0" font-size="11.6" fill="#2B3038" text-anchor="start">Sonuç sürekli</text><path d="M606 516 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#5E4C7D" stroke-width="1.5"/><rect x="700" y="496" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#5E4C7D" stroke-width="1.1"/><text x="711" y="514.0" font-size="11.6" fill="#5E4C7D" text-anchor="start" font-weight="700">Çoklu doğrusal regresyon</text><text x="711" y="526.5" font-size="11.6" fill="#5E4C7D" text-anchor="start" font-weight="700">+ VIF, Breusch–Pagan</text><text x="1044" y="520" font-size="10.8" fill="#6B7280" text-anchor="start">R kare · standart beta</text><path d="M264 556.0 C292 556.0, 272 562, 300 562" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="560.0" font-size="11.6" fill="#2B3038" text-anchor="start">Sonuç iki kategorili</text><path d="M606 562 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#5E4C7D" stroke-width="1.5"/><rect x="700" y="542" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#5E4C7D" stroke-width="1.1"/><text x="711" y="560.0" font-size="11.6" fill="#5E4C7D" text-anchor="start" font-weight="700">Lojistik regresyon</text><text x="1044" y="566" font-size="10.8" fill="#6B7280" text-anchor="start">Olasılık oranı (OR) · AUC</text><path d="M264 556.0 C292 556.0, 272 608, 300 608" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="606.0" font-size="11.6" fill="#2B3038" text-anchor="start">Sonuç sayım</text><path d="M606 608 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#5E4C7D" stroke-width="1.5"/><rect x="700" y="588" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#5E4C7D" stroke-width="1.1"/><text x="711" y="606.0" font-size="11.6" fill="#5E4C7D" text-anchor="start" font-weight="700">Poisson / negatif binom</text><text x="711" y="618.5" font-size="11.6" fill="#5E4C7D" text-anchor="start" font-weight="700">regresyon</text><text x="1044" y="612" font-size="10.8" fill="#6B7280" text-anchor="start">Oran oranı (IRR)</text><rect x="24" y="646" width="240" height="128" rx="9" fill="#3F7A4E"/><text x="40" y="672.0" font-size="14.5" fill="#FFFFFF" text-anchor="start" font-weight="700">YAPI</text><text x="40" y="692" font-size="11.8" fill="#FFFFFF" text-anchor="start">“Ölçeğim ne</text><text x="40" y="706" font-size="11.8" fill="#FFFFFF" text-anchor="start">ölçüyor?”</text><path d="M264 710.0 C292 710.0, 272 670, 300 670" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="668.0" font-size="11.6" fill="#2B3038" text-anchor="start">İç tutarlılık</text><path d="M606 670 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#3F7A4E" stroke-width="1.5"/><rect x="700" y="650" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#3F7A4E" stroke-width="1.1"/><text x="711" y="668.0" font-size="11.6" fill="#3F7A4E" text-anchor="start" font-weight="700">Cronbach alfa</text><text x="711" y="680.5" font-size="11.6" fill="#3F7A4E" text-anchor="start" font-weight="700">Madde-toplam korelasyonu</text><text x="1044" y="674" font-size="10.8" fill="#6B7280" text-anchor="start">alfa · madde silinirse alfa</text><path d="M264 710.0 C292 710.0, 272 716, 300 716" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="714.0" font-size="11.6" fill="#2B3038" text-anchor="start">Boyut sayısı bilinmiyor</text><path d="M606 716 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#3F7A4E" stroke-width="1.5"/><rect x="700" y="696" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#3F7A4E" stroke-width="1.1"/><text x="711" y="714.0" font-size="11.6" fill="#3F7A4E" text-anchor="start" font-weight="700">Açımlayıcı faktör analizi</text><text x="711" y="726.5" font-size="11.6" fill="#3F7A4E" text-anchor="start" font-weight="700">(önce KMO ve Bartlett)</text><text x="1044" y="720" font-size="10.8" fill="#6B7280" text-anchor="start">Açıklanan varyans</text><path d="M264 710.0 C292 710.0, 272 762, 300 762" fill="none" stroke="#C9D0D8" stroke-width="1.4"/><text x="300" y="760.0" font-size="11.6" fill="#2B3038" text-anchor="start">Boyut yapısı kuramdan geliyor</text><path d="M606 762 h26 m-6 -4 l6 4 -6 4" fill="none" stroke="#3F7A4E" stroke-width="1.5"/><rect x="700" y="742" width="330" height="34" rx="6" fill="#F7F8FA" stroke="#3F7A4E" stroke-width="1.1"/><text x="711" y="760.0" font-size="11.6" fill="#3F7A4E" text-anchor="start" font-weight="700">Doğrulayıcı faktör analizi</text><text x="1044" y="766" font-size="10.8" fill="#6B7280" text-anchor="start">CFI · RMSEA · SRMR</text><rect x="24" y="818" width="1132" height="52" rx="7" fill="#FDF5F5" stroke="#E0C2C4" stroke-width="1"/><text x="38" y="838.0" font-size="11.8" fill="#A8414A" text-anchor="start" font-weight="700">HER TESTTEN ÖNCE — varsayım denetimi</text><text x="38" y="855" font-size="10.8" fill="#6B4347" text-anchor="start">Dağılım biçimi (çarpıklık, basıklık) · varyans eşitliği (Levene) · bağımsızlık · yeterli hücre büyüklüğü.  Varsayım sağlanmıyorsa parametrik olmayan karşılığa geçilir — ikisi birlikte raporlanırsa karar varsayıma bağlı kalmaz.</text></svg>