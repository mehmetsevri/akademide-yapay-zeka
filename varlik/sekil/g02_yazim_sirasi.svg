<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 546" width="1000" height="546" font-family="'PT Sans','Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1000" height="546" fill="#FFFFFF"/><text x="30" y="30" font-size="16.5" font-weight="700" fill="#1F3A5F">Okuma sırası ile yazma sırası aynı değildir</text><text x="30" y="60" font-size="11" font-weight="700" fill="#6B7280">OKUR BÖYLE GÖRÜR</text><text x="330" y="60" font-size="11" font-weight="700" fill="#227C8C">SİZ BÖYLE YAZIN</text><text x="602" y="60" font-size="11" font-weight="700" fill="#6B7280">NEDEN</text><text x="30" y="528" font-size="11.5" fill="#6B7280">Kural: elinizde en çok malzeme olan bölümden başlayın. Giriş en sona kalır, çünkü ne bulduğunuzu ancak o zaman bilirsiniz.</text><rect x="30" y="76" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="102" font-size="13" fill="#6B7280">Başlık</text><text x="226" y="102" font-size="12" fill="#AAB1B9" text-anchor="end">1</text><rect x="30" y="128" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="154" font-size="13" fill="#6B7280">Öz</text><text x="226" y="154" font-size="12" fill="#AAB1B9" text-anchor="end">2</text><rect x="30" y="180" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="206" font-size="13" fill="#6B7280">Giriş</text><text x="226" y="206" font-size="12" fill="#AAB1B9" text-anchor="end">3</text><rect x="30" y="232" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="258" font-size="13" fill="#6B7280">İlgili çalışmalar</text><text x="226" y="258" font-size="12" fill="#AAB1B9" text-anchor="end">4</text><rect x="30" y="284" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="310" font-size="13" fill="#6B7280">Yöntem</text><text x="226" y="310" font-size="12" fill="#AAB1B9" text-anchor="end">5</text><rect x="30" y="336" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="362" font-size="13" fill="#6B7280">Bulgular</text><text x="226" y="362" font-size="12" fill="#AAB1B9" text-anchor="end">6</text><rect x="30" y="388" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="414" font-size="13" fill="#6B7280">Tartışma</text><text x="226" y="414" font-size="12" fill="#AAB1B9" text-anchor="end">7</text><rect x="30" y="440" width="210" height="40" rx="6" fill="#EEF1F4" stroke="#D7DCE2" stroke-width="1"/><text x="44" y="466" font-size="13" fill="#6B7280">Sonuç</text><text x="226" y="466" font-size="12" fill="#AAB1B9" text-anchor="end">8</text><path d="M240 304.0 C290 304.0, 280 96.0, 330 96.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="76" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="102" font-size="13" font-weight="700" fill="#FFFFFF">Yöntem</text><text x="566" y="102" font-size="12" fill="#9FB3C8" text-anchor="end">1</text><text x="602" y="102" font-size="12" fill="#4D555E">Ne yaptığınızı zaten biliyorsunuz</text><path d="M240 356.0 C290 356.0, 280 148.0, 330 148.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="128" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="154" font-size="13" font-weight="700" fill="#FFFFFF">Bulgular</text><text x="566" y="154" font-size="12" fill="#9FB3C8" text-anchor="end">2</text><text x="602" y="154" font-size="12" fill="#4D555E">Sayılar elinizde, yorum yok</text><path d="M240 408.0 C290 408.0, 280 200.0, 330 200.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="180" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="206" font-size="13" font-weight="700" fill="#FFFFFF">Tartışma</text><text x="566" y="206" font-size="12" fill="#9FB3C8" text-anchor="end">3</text><text x="602" y="206" font-size="12" fill="#4D555E">Burada literatürle konuşmaya başlarsınız</text><path d="M240 252.0 C290 252.0, 280 252.0, 330 252.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="232" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="258" font-size="13" font-weight="700" fill="#FFFFFF">İlgili çalışmalar</text><text x="566" y="258" font-size="12" fill="#9FB3C8" text-anchor="end">4</text><text x="602" y="258" font-size="12" fill="#4D555E">Hangi kaynaklara ihtiyaç olduğu belli oldu</text><path d="M240 200.0 C290 200.0, 280 304.0, 330 304.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="284" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="310" font-size="13" font-weight="700" fill="#FFFFFF">Giriş</text><text x="566" y="310" font-size="12" fill="#9FB3C8" text-anchor="end">5</text><text x="602" y="310" font-size="12" fill="#4D555E">Artık ne bulduğunuzu biliyorsunuz</text><path d="M240 460.0 C290 460.0, 280 356.0, 330 356.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="336" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="362" font-size="13" font-weight="700" fill="#FFFFFF">Sonuç</text><text x="566" y="362" font-size="12" fill="#9FB3C8" text-anchor="end">6</text><text x="602" y="362" font-size="12" fill="#4D555E">Girişteki söz tutuldu mu</text><path d="M240 148.0 C290 148.0, 280 408.0, 330 408.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="388" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="414" font-size="13" font-weight="700" fill="#FFFFFF">Öz</text><text x="566" y="414" font-size="12" fill="#9FB3C8" text-anchor="end">7</text><text x="602" y="414" font-size="12" fill="#4D555E">Özetlenecek şey ancak şimdi hazır</text><path d="M240 96.0 C290 96.0, 280 460.0, 330 460.0" fill="none" stroke="#227C8C" stroke-width="1.5" opacity="0.5"/><rect x="330" y="440" width="250" height="40" rx="6" fill="#1F3A5F"/><text x="344" y="466" font-size="13" font-weight="700" fill="#FFFFFF">Başlık</text><text x="566" y="466" font-size="12" fill="#9FB3C8" text-anchor="end">8</text><text x="602" y="466" font-size="12" fill="#4D555E">En kısa bölüm, en son</text></svg>